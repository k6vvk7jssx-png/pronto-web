<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caricamento...</title>
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Pronto-Web Vibe Coding",
      "description": "Sviluppo web AI-Driven a costo fisso zero.",
      "telephone": "+39 377 317 6007",
      "priceRange": "$$"
    }
    </script>

    <style>
        /* --- VIBE CODING DESIGN SYSTEM --- */
        :root {
            --bg-color: #F8FAFC;
            --surface: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #475569;
            --primary: #2563EB;      
            --primary-dark: #1E40AF;
            --accent: #8B5CF6;       
            --success: #10B981;      
            --font-head: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { font-family: var(--font-body); background: var(--bg-color); color: var(--text-main); line-height: 1.6; }
        
        /* Utils */
        .container { max-width: 1000px; margin: 0 auto; padding: 0 24px; }
        h1, h2, h3 { font-family: var(--font-head); font-weight: 700; letter-spacing: -0.03em; }
        .text-gradient { background: linear-gradient(to right, var(--primary), var(--accent)); -webkit-background-clip: text; color: transparent; }
        .hidden { display: none; }

        /* Buttons */
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 14px 28px; border-radius: 12px; font-weight: 600; text-decoration: none; transition: 0.2s; border: none; cursor: pointer; font-size: 1rem; }
        .btn-primary { background: var(--text-main); color: white; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2); }
        .btn-primary:hover { transform: translateY(-2px); background: black; }
        .btn-wa { background: #25D366; color: white; gap: 8px; }
        
        /* Header */
        header { padding: 20px 0; border-bottom: 1px solid #E2E8F0; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
        .nav { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 1.4rem; font-family: var(--font-head); display: flex; align-items: center; gap: 5px; }
        
        /* Hero */
        .hero { padding: 120px 0 80px; text-align: center; }
        h1 { font-size: 3.5rem; line-height: 1.1; margin-bottom: 20px; }
        .hero p { font-size: 1.2rem; color: var(--text-muted); max-width: 650px; margin: 0 auto 30px; }
        .badges-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 40px; }
        .badge { background: #E0F2FE; color: #0369A1; padding: 6px 14px; border-radius: 20px; font-size: 0.9rem; font-weight: 600; }
        
        /* Metodo Vibe Coding */
        .section { padding: 80px 0; }
        .section-title { text-align: center; font-size: 2.2rem; margin-bottom: 10px; }
        .section-subtitle { text-align: center; color: var(--text-muted); margin-bottom: 50px; max-width: 600px; margin-left: auto; margin-right: auto; }
        
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .card { background: var(--surface); padding: 30px; border-radius: 16px; border: 1px solid #E2E8F0; transition: 0.3s; }
        .card:hover { border-color: var(--primary); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .card-icon { font-size: 2.5rem; margin-bottom: 15px; display: block; }
        
        /* ROI Box */
        .roi-box { background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%); color: white; padding: 50px; border-radius: 24px; text-align: center; margin: 40px 0; }
        .roi-box h3 { font-size: 2rem; margin-bottom: 15px; color: #38BDF8; }
        .roi-features { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
        .roi-check { background: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 8px; display: flex; align-items: center; gap: 8px; }
        
        /* FAQ */
        .faq-item { background: var(--surface); border: 1px solid #E2E8F0; padding: 20px; border-radius: 12px; margin-bottom: 15px; }
        .faq-q { font-weight: 700; margin-bottom: 8px; color: var(--text-main); display: flex; justify-content: space-between;}
        .faq-a { color: var(--text-muted); font-size: 0.95rem; }

        /* Form */
        .form-container { background: var(--surface); padding: 40px; border-radius: 20px; border: 1px solid #E2E8F0; box-shadow: 0 20px 40px rgba(0,0,0,0.05); max-width: 600px; margin: 0 auto; }
        input, select, textarea { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #CBD5E1; border-radius: 8px; font-family: inherit; font-size: 1rem; }
        input:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        
        /* Footer */
        footer { text-align: center; padding: 60px 0 20px; color: var(--text-muted); font-size: 0.9rem; }
        
        /* Loading */
        #loader { position: fixed; inset: 0; background: white; z-index: 999; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.5rem; }

        @media(max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .hero { padding: 100px 0 60px; }
            .roi-box { padding: 30px; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div id="loader">Vibe Coding Engine...</div>

    <div id="app" class="hidden">
        <header>
            <div class="container nav">
                <div class="logo">⚡ <span id="brand-name"></span></div>
                <a href="#contatti" class="btn btn-primary" style="padding: 10px 20px; font-size: 0.9rem;">Preventivo</a>
            </div>
        </header>

        <section class="hero">
            <div class="container">
                <h1 id="hero-title"></h1>
                <p id="hero-desc"></p>
                
                <div style="margin-top: 30px;">
                    <a href="#contatti" class="btn btn-primary">Voglio un Sito senza Canone</a>
                </div>

                <div class="badges-container" id="badges-list">
                    </div>
            </div>
        </section>

        <section class="section" style="background: white;">
            <div class="container">
                <h2 class="section-title" id="method-title"></h2>
                <p class="section-subtitle" id="method-subtitle"></p>
                <div class="grid-3" id="method-grid"></div>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="roi-box">
                    <h3 id="roi-title"></h3>
                    <p id="roi-desc" style="color: #E2E8F0; font-size: 1.1rem; max-width: 700px; margin: 0 auto;"></p>
                    <div class="roi-features" id="roi-list"></div>
                </div>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <h2 class="section-title">Servizi Smart</h2>
                <div class="grid-3" id="services-grid" style="margin-top: 40px;"></div>
            </div>
        </section>

        <section class="section" style="background: white;">
            <div class="container" style="max-width: 800px;">
                <h2 class="section-title">Domande Frequenti</h2>
                <div id="faq-list" style="margin-top: 40px;"></div>
            </div>
        </section>

        <section id="contatti" class="section">
            <div class="container">
                <div class="form-container">
                    <h2 style="text-align: center; margin-bottom: 20px;">Richiedi Preventivo Rapido</h2>
                    
                    <form action="https://formspree.io/f/xbdddlee" method="POST">
                        <label>Nome Completo</label>
                        <input type="text" name="name" required placeholder="Il tuo nome">
                        
                        <label>Email</label>
                        <input type="email" name="email" required placeholder="tua@email.com">
                        
                        <label>Settore</label>
                        <select name="settore" id="sector-select"></select>
                        
                        <label>Progetto</label>
                        <textarea name="message" rows="3" required placeholder="Descrivi brevemente..."></textarea>
                        
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Invia Richiesta</button>
                    </form>

                    <div style="margin-top: 20px; text-align: center;">
                        <a id="wa-link" href="#" class="btn btn-wa" style="width: 100%; justify-content: center;">
                            WhatsApp Rapido
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <footer>
            <div class="container">
                <h3>Smetti di pagare canoni inutili.</h3>
                <p style="margin: 10px 0 30px;">Passa all'architettura web moderna.</p>
                <p>&copy; 2024 <span id="footer-owner"></span> - Pronto-Web</p>
            </div>
        </footer>
    </div>

    <script>
        async function initVibeCoding() {
            try {
                // Fetch JSON database
                const res = await fetch('dati.json');
                if (!res.ok) throw new Error("Errore nel caricamento dati");
                const db = await res.json();

                // 1. Meta & Brand
                document.title = `${db.brand.nome} | Zero Costi Fissi`;
                document.getElementById('brand-name').innerText = db.brand.nome;
                document.getElementById('footer-owner').innerText = db.brand.owner;

                // 2. Hero
                const heroHtml = `${db.hero.titolo} <span class="text-gradient">${db.hero.titolo_accento}</span>`;
                document.getElementById('hero-title').innerHTML = heroHtml;
                document.getElementById('hero-desc').innerText = db.hero.descrizione;
                
                // Badges
                const badgeContainer = document.getElementById('badges-list');
                badgeContainer.innerHTML = ""; // Pulisce
                db.hero.badges.forEach(badge => {
                    badgeContainer.innerHTML += `<span class="badge">${badge}</span>`;
                });

                // 3. Metodo Vibe Coding
                document.getElementById('method-title').innerText = db.metodo.titolo;
                document.getElementById('method-subtitle').innerText = db.metodo.sottotitolo;
                const methodGrid = document.getElementById('method-grid');
                methodGrid.innerHTML = ""; // Pulisce
                db.metodo.punti.forEach(punto => {
                    methodGrid.innerHTML += `
                        <div class="card">
                            <span class="card-icon">${punto.icona}</span>
                            <h3>${punto.titolo}</h3>
                            <p style="color:var(--text-muted); margin-top:10px;">${punto.desc}</p>
                        </div>
                    `;
                });

                // 4. ROI Section
                document.getElementById('roi-title').innerText = db.roi.titolo;
                document.getElementById('roi-desc').innerText = db.roi.descrizione;
                const roiList = document.getElementById('roi-list');
                roiList.innerHTML = ""; // Pulisce
                db.roi.features.forEach(feat => {
                    roiList.innerHTML += `<div class="roi-check">✅ ${feat}</div>`;
                });

                // 5. Servizi
                const srvGrid = document.getElementById('services-grid');
                srvGrid.innerHTML = ""; // Pulisce
                db.servizi.forEach(srv => {
                    srvGrid.innerHTML += `
                        <div class="card">
                            <span class="card-icon">${srv.icona}</span>
                            <h3>${srv.titolo}</h3>
                            <p style="color:var(--text-muted); margin-top:10px;">${srv.desc}</p>
                        </div>
                    `;
                });

                // 6. FAQ
                const faqList = document.getElementById('faq-list');
                faqList.innerHTML = ""; // Pulisce
                db.faq.forEach(q => {
                    faqList.innerHTML += `
                        <div class="faq-item">
                            <div class="faq-q">${q.domanda} <span>▼</span></div>
                            <div class="faq-a">${q.risposta}</div>
                        </div>
                    `;
                });

                // 7. Form & Footer Links
                const sectorSelect = document.getElementById('sector-select');
                sectorSelect.innerHTML = ""; // Pulisce
                db.settori_clienti.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s; opt.innerText = s;
                    sectorSelect.appendChild(opt);
                });

                document.getElementById('wa-link').href = db.contatti.link_whatsapp;

                // Show Site
                document.getElementById('loader').style.display = 'none';
                document.getElementById('app').classList.remove('hidden');

            } catch (err) {
                console.error(err);
                document.getElementById('loader').innerText = "Attenzione: Assicurati di aver caricato anche dati.json!";
            }
        }

        initVibeCoding();
    </script>
</body>
</html>
